<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NormaAI Legal — Restablecer contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --azul:#0a1628;
  --azul-med:#0d2144;
  --acento:#1a6cf8;
  --acento-cl:#3d84fa;
  --gris:#8a96a8;
  --blanco:#ffffff;
  --borde:rgba(255,255,255,0.07);
  --verde:#22c55e;
  --rojo:#ef4444;
}
html,body{font-family:'DM Sans',sans-serif;background:var(--azul);color:var(--blanco);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:rgba(255,255,255,0.04);border:1px solid var(--borde);border-radius:16px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,0.4);}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
.logo-icon{width:40px;height:40px;background:var(--acento);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.logo-text{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;line-height:1.2;}
.logo-text span{display:block;font-size:11px;font-weight:400;color:var(--gris);}
h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:700;margin-bottom:8px;}
.subtitle{font-size:14px;color:var(--gris);margin-bottom:28px;line-height:1.5;}
.field{margin-bottom:16px;}
label{display:block;font-size:12px;font-weight:500;color:var(--gris);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
input{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--borde);border-radius:8px;padding:12px 14px;color:var(--blanco);font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border .2s;}
input:focus{border-color:var(--acento);}
input::placeholder{color:rgba(255,255,255,0.25);}
.btn{width:100%;background:var(--acento);color:var(--blanco);border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .2s;}
.btn:hover:not(:disabled){background:var(--acento-cl);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.msg{border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:16px;display:none;}
.msg.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5;}
.msg.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac;}
.volver{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--gris);text-decoration:none;}
.volver:hover{color:var(--blanco);}
#estado-token{font-size:13px;color:var(--gris);text-align:center;margin-bottom:16px;}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">⚖️</div>
    <div class="logo-text">NormaAI <span>LEGAL · BY PROCESUS</span></div>
  </div>

  <h1>Nueva contraseña</h1>
  <p class="subtitle">Ingresa y confirma tu nueva contraseña para acceder a la plataforma.</p>

  <div id="estado-token">Verificando enlace…</div>
  <div class="msg error" id="msg-error"></div>
  <div class="msg ok" id="msg-ok"></div>

  <form id="form-reset" onsubmit="cambiarPassword(event)" style="display:none">
    <div class="field">
      <label>Nueva contraseña</label>
      <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirmar contraseña</label>
      <input type="password" id="confirm" placeholder="Repite la contraseña" autocomplete="new-password">
    </div>
    <button class="btn" id="btn-submit" type="submit">Cambiar contraseña</button>
  </form>

  <a class="volver" href="/login">← Volver al inicio</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
let supabase;

function showError(msg) {
  const el = document.getElementById('msg-error');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('msg-ok').style.display = 'none';
}

function showOk(msg) {
  const el = document.getElementById('msg-ok');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('msg-error').style.display = 'none';
}

async function init() {
  const estadoEl = document.getElementById('estado-token');

  // Parsear el hash de la URL
  const hash = new URLSearchParams(window.location.hash.substring(1));
  const access_token = hash.get('access_token');
  const refresh_token = hash.get('refresh_token');
  const type = hash.get('type');

  if (type !== 'recovery' || !access_token) {
    estadoEl.textContent = 'Enlace inválido o expirado.';
    showError('Este enlace no es válido. Solicita uno nuevo desde la pantalla de inicio.');
    return;
  }

  // Obtener config pública y crear cliente Supabase
  let config;
  try {
    config = await fetch('/api/config').then(r => r.json());
  } catch {
    estadoEl.textContent = '';
    showError('Error de conexión. Intenta nuevamente.');
    return;
  }

  supabase = window.supabase.createClient(config.supabase_url, config.supabase_anon_key);

  // Establecer sesión con el token de recuperación
  const { error: sessionError } = await supabase.auth.setSession({ access_token, refresh_token: refresh_token || '' });
  if (sessionError) {
    estadoEl.textContent = '';
    showError('El enlace expiró o ya fue utilizado. Solicita uno nuevo.');
    return;
  }

  estadoEl.style.display = 'none';
  document.getElementById('form-reset').style.display = 'block';
}

async function cambiarPassword(e) {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const btn = document.getElementById('btn-submit');

  if (password.length < 6) { showError('La contraseña debe tener al menos 6 caracteres.'); return; }
  if (password !== confirm) { showError('Las contraseñas no coinciden.'); return; }

  btn.disabled = true;
  btn.textContent = 'Guardando…';

  const { error } = await supabase.auth.updateUser({ password });
  if (error) {
    showError('Error al cambiar la contraseña: ' + error.message);
    btn.disabled = false;
    btn.textContent = 'Cambiar contraseña';
    return;
  }

  showOk('¡Contraseña actualizada! Redirigiendo al inicio de sesión…');
  document.getElementById('form-reset').style.display = 'none';
  setTimeout(() => window.location.href = '/login', 2500);
}

init();
</script>
</body>
</html>
