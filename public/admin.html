<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NormaAI — Panel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#0a1628;--azul-med:#0d2144;--acento:#1a6cf8;--acento-cl:#3d84fa;
  --dorado:#c9a84c;--gris:#8a96a8;--blanco:#ffffff;--sidebar-w:240px;
  --verde:#16a34a;--rojo:#dc2626;--amarillo:#ca8a04;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#0e1520;color:var(--blanco);}
.layout{display:flex;min-height:100vh;}
.sidebar{background:var(--azul);border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;padding:1.5rem 0;position:sticky;top:0;width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;overflow-y:auto;flex-shrink:0;}
.main{flex:1;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;background:#0e1520;}
.logo{display:flex;align-items:center;gap:.7rem;padding:0 1.5rem 1.2rem;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:1.2rem;}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--acento),var(--acento-cl));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:1.05rem;}
.logo-badge{font-size:.6rem;background:var(--dorado);color:#000;border-radius:4px;padding:.15rem .4rem;font-weight:700;letter-spacing:.05em;margin-top:2px;}
.nav-section{padding:0 .75rem;margin-bottom:.5rem;}
.nav-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:#3d4f6a;font-weight:600;padding:0 .75rem;margin-bottom:.4rem;}
.nav-item{display:flex;align-items:center;gap:.7rem;padding:.65rem .75rem;border-radius:8px;font-size:.87rem;color:#8a96a8;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;}
.nav-item:hover{background:rgba(255,255,255,0.05);color:var(--blanco);}
.nav-item.active{background:rgba(26,108,248,0.15);color:var(--acento-cl);}
.nav-icon{font-size:1rem;width:20px;text-align:center;}
.sidebar-footer{margin-top:auto;padding:1rem 1.5rem;border-top:1px solid rgba(255,255,255,0.06);}
.btn-logout{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:.5rem;color:var(--gris);font-size:.82rem;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-logout:hover{background:rgba(220,38,38,0.1);color:#fca5a5;}
.topbar{background:rgba(10,22,40,0.8);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.06);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.page-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:700;}
.topbar-badge{background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);color:var(--dorado);border-radius:6px;padding:.25rem .7rem;font-size:.75rem;font-weight:600;}
.view{display:none;padding:2rem;}
.view.active{display:block;}

/* KPI Cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:2rem;}
.kpi-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:1.2rem;border-left:3px solid var(--acento);}
.kpi-card.verde{border-left-color:var(--verde);}
.kpi-card.amarillo{border-left-color:var(--amarillo);}
.kpi-card.rojo{border-left-color:var(--rojo);}
.kpi-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gris);font-weight:600;margin-bottom:.4rem;}
.kpi-value{font-size:1.8rem;font-weight:700;color:var(--blanco);font-family:'Syne',sans-serif;}
.kpi-sub{font-size:.75rem;color:var(--gris);margin-top:.2rem;}

/* Tabla */
.tabla-container{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;overflow:hidden;}
.tabla-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem;border-bottom:1px solid rgba(255,255,255,0.06);}
.tabla-titulo{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;}
table{width:100%;border-collapse:collapse;}
th{background:rgba(15,42,74,0.8);padding:.7rem 1rem;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gris);font-weight:600;}
td{padding:.75rem 1rem;font-size:.85rem;border-bottom:1px solid rgba(255,255,255,0.04);}
tr:hover td{background:rgba(255,255,255,0.02);}
tr:last-child td{border-bottom:none;}

/* Badges */
.badge{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.72rem;font-weight:600;}
.badge-verde{background:rgba(22,163,74,0.15);color:#4ade80;}
.badge-rojo{background:rgba(220,38,38,0.15);color:#f87171;}
.badge-amarillo{background:rgba(202,138,4,0.15);color:#fbbf24;}
.badge-azul{background:rgba(26,108,248,0.15);color:#60a5fa;}

/* Botones */
.btn{padding:.45rem .9rem;border-radius:7px;font-size:.82rem;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s;}
.btn-primary{background:var(--acento);color:#fff;}
.btn-primary:hover{background:#1558d0;}
.btn-danger{background:rgba(220,38,38,0.15);color:#f87171;border:1px solid rgba(220,38,38,0.2);}
.btn-danger:hover{background:rgba(220,38,38,0.25);}
.btn-success{background:rgba(22,163,74,0.15);color:#4ade80;border:1px solid rgba(22,163,74,0.2);}
.btn-success:hover{background:rgba(22,163,74,0.25);}
.btn-sm{padding:.3rem .7rem;font-size:.75rem;}

/* Formulario noticias */
.form-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;}
.form-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:1.2rem;display:flex;align-items:center;gap:.5rem;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.form-field{display:flex;flex-direction:column;gap:.4rem;}
.form-field.full{grid-column:1/-1;}
label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);font-weight:600;}
input,select,textarea{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:.65rem .9rem;font-size:.88rem;color:var(--blanco);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--acento);background:rgba(26,108,248,0.06);}
input::placeholder,textarea::placeholder{color:#4a5568;}
select option{background:#0d2144;color:#fff;}
textarea{resize:vertical;min-height:80px;}

/* Toggle publicada */
.toggle-wrap{display:flex;align-items:center;gap:.6rem;}
.toggle{width:40px;height:22px;background:rgba(255,255,255,0.1);border-radius:999px;cursor:pointer;position:relative;transition:background .2s;border:none;}
.toggle.on{background:var(--verde);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s;}
.toggle.on::after{transform:translateX(18px);}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:3rem;color:var(--gris);}
.spinner{width:24px;height:24px;border:2px solid rgba(26,108,248,0.2);border-top-color:var(--acento);border-radius:50%;animation:spin .8s linear infinite;margin-right:.7rem;}
@keyframes spin{to{transform:rotate(360deg)}}

.empty{text-align:center;padding:3rem;color:var(--gris);font-size:.88rem;}
.success-msg{background:rgba(22,163,74,0.1);border:1px solid rgba(22,163,74,0.2);border-radius:8px;padding:.8rem 1rem;font-size:.85rem;color:#4ade80;margin-bottom:1rem;display:none;}
.error-msg{background:rgba(220,38,38,0.1);border:1px solid rgba(220,38,38,0.2);border-radius:8px;padding:.8rem 1rem;font-size:.85rem;color:#f87171;margin-bottom:1rem;display:none;}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">⚖</div>
      <div>
        <div class="logo-text">NormaAI</div>
        <div class="logo-badge">ADMIN</div>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Panel</div>
      <button class="nav-item active" onclick="mostrarVista('resumen',this)"><span class="nav-icon">📊</span> Resumen</button>
      <button class="nav-item" onclick="mostrarVista('noticias',this)"><span class="nav-icon">📰</span> Noticias</button>
      <button class="nav-item" onclick="mostrarVista('clientes',this)"><span class="nav-icon">👥</span> Clientes</button>
      <button class="nav-item" onclick="mostrarVista('uso',this)"><span class="nav-icon">📈</span> Uso Agente</button>
    </div>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="hacerLogout()">← Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="page-title" id="page-title">Resumen</div>
      <div class="topbar-badge">⚙️ Administrador</div>
    </div>

    <!-- RESUMEN -->
    <div class="view active" id="vista-resumen">
      <div id="resumen-content"><div class="loading"><div class="spinner"></div>Cargando...</div></div>
    </div>

    <!-- NOTICIAS -->
    <div class="view" id="vista-noticias">
      <div class="success-msg" id="noticia-ok">✅ Noticia guardada correctamente.</div>
      <div class="error-msg" id="noticia-err">❌ Error al guardar. Intenta nuevamente.</div>

      <!-- Formulario nueva noticia -->
      <div class="form-card">
        <div class="form-title">➕ Nueva Noticia</div>
        <div class="form-grid">
          <div class="form-field full">
            <label>Título *</label>
            <input type="text" id="n-titulo" placeholder="Ej: Actualización DS 594 sobre condiciones sanitarias">
          </div>
          <div class="form-field full">
            <label>Resumen</label>
            <textarea id="n-resumen" placeholder="Breve descripción de la noticia..."></textarea>
          </div>
          <div class="form-field">
            <label>Categoría</label>
            <select id="n-categoria">
              <option value="General">General</option>
              <option value="Laboral">Laboral</option>
              <option value="Ambiental">Ambiental</option>
              <option value="Seguridad">Seguridad</option>
              <option value="Digital">Digital</option>
            </select>
          </div>
          <div class="form-field">
            <label>URL Fuente (opcional)</label>
            <input type="url" id="n-url" placeholder="https://bcn.cl/leychile/...">
          </div>
          <div class="form-field full">
            <label>Video YouTube (opcional)</label>
            <input type="url" id="n-video" placeholder="https://www.youtube.com/watch?v=...">
          </div>
          <div class="form-field">
            <label>Publicar ahora</label>
            <div class="toggle-wrap">
              <button class="toggle" id="n-publicada" onclick="togglePublicada()"></button>
              <span id="n-publicada-label" style="font-size:.83rem;color:var(--gris);">No publicada</span>
            </div>
          </div>
        </div>
        <div style="margin-top:1.2rem;">
          <button class="btn btn-primary" onclick="guardarNoticia()">💾 Guardar Noticia</button>
        </div>
      </div>

      <!-- Lista de noticias -->
      <div class="tabla-container">
        <div class="tabla-header">
          <div class="tabla-titulo">📰 Noticias publicadas</div>
          <button class="btn btn-primary btn-sm" onclick="cargarNoticias()">🔄 Actualizar</button>
        </div>
        <div id="noticias-lista"><div class="loading"><div class="spinner"></div>Cargando...</div></div>
      </div>
    </div>

    <!-- CLIENTES -->
    <div class="view" id="vista-clientes">
      <div class="tabla-container">
        <div class="tabla-header">
          <div class="tabla-titulo">👥 Clientes activos</div>
          <button class="btn btn-primary btn-sm" onclick="cargarClientes()">🔄 Actualizar</button>
        </div>
        <div id="clientes-lista"><div class="loading"><div class="spinner"></div>Cargando...</div></div>
      </div>
    </div>

    <!-- USO AGENTE -->
    <div class="view" id="vista-uso">
      <div class="tabla-container">
        <div class="tabla-header">
          <div class="tabla-titulo">📈 Uso del Agente — Mes actual</div>
          <button class="btn btn-primary btn-sm" onclick="cargarUso()">🔄 Actualizar</button>
        </div>
        <div id="uso-lista"><div class="loading"><div class="spinner"></div>Cargando...</div></div>
      </div>
    </div>
  </main>
</div>

<script>
const token = localStorage.getItem('normaai_token');
if (!token) { window.location.href = '/login'; }

const titulos = { resumen:'Resumen', noticias:'Gestión de Noticias', clientes:'Clientes', uso:'Uso del Agente' };
var publicadaActual = false;

function mostrarVista(nombre, el) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('vista-' + nombre).classList.add('active');
  el.classList.add('active');
  document.getElementById('page-title').textContent = titulos[nombre];
  if (nombre === 'resumen') cargarResumen();
  if (nombre === 'noticias') cargarNoticias();
  if (nombre === 'clientes') cargarClientes();
  if (nombre === 'uso') cargarUso();
}

function togglePublicada() {
  publicadaActual = !publicadaActual;
  const btn = document.getElementById('n-publicada');
  const lbl = document.getElementById('n-publicada-label');
  btn.className = 'toggle' + (publicadaActual ? ' on' : '');
  lbl.textContent = publicadaActual ? 'Publicada ✅' : 'No publicada';
}

async function apiGet(url) {
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  if (res.status === 401) { hacerLogout(); return null; }
  return res.json();
}

async function apiPost(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify(body)
  });
  return { ok: res.ok, data: await res.json() };
}

// ── Resumen ──────────────────────────────────────────────────
async function cargarResumen() {
  const cont = document.getElementById('resumen-content');
  try {
    const [clientes, noticias, uso] = await Promise.all([
      apiGet('/api/admin/clientes'),
      apiGet('/api/admin/noticias'),
      apiGet('/api/admin/uso')
    ]);
    if (!clientes) return;

    const activos = clientes.filter(c => c.activo).length;
    const publicadas = noticias.filter(n => n.publicada).length;
    const mesActual = new Date().toISOString().slice(0,7);
    const consultasMes = uso.filter(u => u.mes === mesActual).reduce((a,b) => a + b.consultas, 0);
    const porVencer = clientes.filter(c => {
      if (!c.fecha_fin) return false;
      const dias = (new Date(c.fecha_fin) - new Date()) / (1000*60*60*24);
      return dias <= 30 && dias > 0;
    }).length;

    cont.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card verde">
          <div class="kpi-label">Clientes Activos</div>
          <div class="kpi-value">${activos}</div>
          <div class="kpi-sub">${clientes.length} total registrados</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Consultas este mes</div>
          <div class="kpi-value">${consultasMes}</div>
          <div class="kpi-sub">en ${new Date().toLocaleString('es-CL',{month:'long'})}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Noticias publicadas</div>
          <div class="kpi-value">${publicadas}</div>
          <div class="kpi-sub">${noticias.length} total</div>
        </div>
        <div class="kpi-card ${porVencer > 0 ? 'amarillo' : 'verde'}">
          <div class="kpi-label">Vencen en 30 días</div>
          <div class="kpi-value">${porVencer}</div>
          <div class="kpi-sub">clientes a renovar</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
        <div class="tabla-container">
          <div class="tabla-header"><div class="tabla-titulo">Últimos clientes</div></div>
          <table>
            <thead><tr><th>Empresa</th><th>Estado</th><th>Vence</th></tr></thead>
            <tbody>${clientes.slice(0,5).map(c => {
              const dias = c.fecha_fin ? Math.ceil((new Date(c.fecha_fin)-new Date())/(1000*60*60*24)) : null;
              const vence = dias ? (dias < 30 ? '<span class="badge badge-amarillo">'+dias+'d</span>' : '<span class="badge badge-verde">'+dias+'d</span>') : '—';
              return '<tr><td>'+(c.empresa||c.nombre)+'</td><td><span class="badge '+(c.activo?'badge-verde':'badge-rojo')+'">'+(c.activo?'Activo':'Inactivo')+'</span></td><td>'+vence+'</td></tr>';
            }).join('')}</tbody>
          </table>
        </div>
        <div class="tabla-container">
          <div class="tabla-header"><div class="tabla-titulo">Top uso agente</div></div>
          <table>
            <thead><tr><th>Usuario</th><th>Mes</th><th>Consultas</th></tr></thead>
            <tbody>${uso.slice(0,5).map(u => '<tr><td style="font-size:.78rem;">'+u.email+'</td><td>'+u.mes+'</td><td><span class="badge badge-azul">'+u.consultas+'</span></td></tr>').join('')}</tbody>
          </table>
        </div>
      </div>`;
  } catch(e) {
    cont.innerHTML = '<div class="empty">Error al cargar resumen.</div>';
  }
}

// ── Noticias ─────────────────────────────────────────────────
async function cargarNoticias() {
  const cont = document.getElementById('noticias-lista');
  const data = await apiGet('/api/admin/noticias');
  if (!data) return;
  if (!data.length) { cont.innerHTML = '<div class="empty">No hay noticias aún.</div>'; return; }
  cont.innerHTML = '<table><thead><tr><th>Título</th><th>Categoría</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>' +
    data.map(n => `<tr>
      <td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${n.titulo}</td>
      <td><span class="badge badge-azul">${n.categoria||'General'}</span></td>
      <td><span class="badge ${n.publicada?'badge-verde':'badge-amarillo'}">${n.publicada?'Publicada':'Borrador'}</span></td>
      <td style="font-size:.78rem;color:var(--gris);">${new Date(n.created_at).toLocaleDateString('es-CL')}</td>
      <td style="display:flex;gap:.4rem;">
        <button class="btn btn-sm ${n.publicada?'btn-danger':'btn-success'}" onclick="toggleNoticia('${n.id}',${n.publicada})">${n.publicada?'Despublicar':'Publicar'}</button>
        <button class="btn btn-danger btn-sm" onclick="eliminarNoticia('${n.id}')">🗑</button>
      </td>
    </tr>`).join('') + '</tbody></table>';
}

async function guardarNoticia() {
  const titulo = document.getElementById('n-titulo').value.trim();
  if (!titulo) { alert('El título es obligatorio.'); return; }
  const body = {
    titulo,
    resumen: document.getElementById('n-resumen').value.trim(),
    categoria: document.getElementById('n-categoria').value,
    url: document.getElementById('n-url').value.trim(),
    video_url: document.getElementById('n-video').value.trim(),
    publicada: publicadaActual
  };
  const { ok } = await apiPost('/api/admin/noticias/crear', body);
  const okEl = document.getElementById('noticia-ok');
  const errEl = document.getElementById('noticia-err');
  if (ok) {
    okEl.style.display = 'block'; errEl.style.display = 'none';
    document.getElementById('n-titulo').value = '';
    document.getElementById('n-resumen').value = '';
    document.getElementById('n-url').value = '';
    document.getElementById('n-video').value = '';
    publicadaActual = false;
    document.getElementById('n-publicada').className = 'toggle';
    document.getElementById('n-publicada-label').textContent = 'No publicada';
    setTimeout(() => okEl.style.display = 'none', 3000);
    cargarNoticias();
  } else {
    errEl.style.display = 'block'; okEl.style.display = 'none';
  }
}

async function toggleNoticia(id, publicada) {
  await apiPost('/api/admin/noticias/toggle', { id, publicada: !publicada });
  cargarNoticias();
}

async function eliminarNoticia(id) {
  if (!confirm('¿Eliminar esta noticia?')) return;
  await apiPost('/api/admin/noticias/eliminar', { id });
  cargarNoticias();
}

// ── Clientes ─────────────────────────────────────────────────
async function cargarClientes() {
  const cont = document.getElementById('clientes-lista');
  const data = await apiGet('/api/admin/clientes');
  if (!data) return;
  if (!data.length) { cont.innerHTML = '<div class="empty">No hay clientes registrados.</div>'; return; }
  cont.innerHTML = '<table><thead><tr><th>Nombre</th><th>Empresa</th><th>Email</th><th>Estado</th><th>Vence</th><th>Acción</th></tr></thead><tbody>' +
    data.map(c => {
      const dias = c.fecha_fin ? Math.ceil((new Date(c.fecha_fin)-new Date())/(1000*60*60*24)) : null;
      const vence = dias ? (dias < 0 ? '<span class="badge badge-rojo">Vencido</span>' : dias < 30 ? '<span class="badge badge-amarillo">'+dias+'d</span>' : '<span class="badge badge-verde">'+dias+'d</span>') : '—';
      return `<tr>
        <td>${c.nombre}</td>
        <td>${c.empresa||'—'}</td>
        <td style="font-size:.78rem;">${c.email}</td>
        <td><span class="badge ${c.activo?'badge-verde':'badge-rojo'}">${c.activo?'Activo':'Inactivo'}</span></td>
        <td>${vence}</td>
        <td><button class="btn btn-sm ${c.activo?'btn-danger':'btn-success'}" onclick="toggleCliente('${c.id}',${c.activo})">${c.activo?'Desactivar':'Activar'}</button></td>
      </tr>`;
    }).join('') + '</tbody></table>';
}

async function toggleCliente(id, activo) {
  await apiPost('/api/admin/clientes/toggle', { id, activo: !activo });
  cargarClientes();
}

// ── Uso Agente ───────────────────────────────────────────────
async function cargarUso() {
  const cont = document.getElementById('uso-lista');
  const data = await apiGet('/api/admin/uso');
  if (!data) return;
  if (!data.length) { cont.innerHTML = '<div class="empty">Sin registros de uso aún.</div>'; return; }
  cont.innerHTML = '<table><thead><tr><th>Usuario</th><th>Mes</th><th>Consultas</th><th>% del límite</th></tr></thead><tbody>' +
    data.map(u => {
      const pct = Math.min(100, Math.round(u.consultas / 100 * 100));
      const color = pct > 80 ? 'badge-rojo' : pct > 50 ? 'badge-amarillo' : 'badge-verde';
      return `<tr>
        <td>${u.email}</td>
        <td>${u.mes}</td>
        <td><span class="badge badge-azul">${u.consultas}</span></td>
        <td><span class="badge ${color}">${pct}%</span></td>
      </tr>`;
    }).join('') + '</tbody></table>';
}

// ── Logout ───────────────────────────────────────────────────
async function hacerLogout() {
  try { await fetch('/api/logout', { method:'POST', headers:{ Authorization:'Bearer '+token }}); } catch(e) {}
  localStorage.removeItem('normaai_token');
  localStorage.removeItem('normaai_user');
  window.location.href = '/login';
}

cargarResumen();
</script>
